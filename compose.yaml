services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: yolda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yolda_local}
      POSTGRES_DB: yolda
    ports: ["127.0.0.1:${DB_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yolda"]
      interval: 2s
      retries: 20
  storage:
    build:
      context: .
      network: ${BUILD_NETWORK:-default}
    command: npm run storage:dev
    environment:
      S3_BIND: 0.0.0.0
      S3_DATA_DIR: /app/storage/objects
      DEPLOYMENT_ENV: development
    ports: ["127.0.0.1:${STORAGE_PORT:-9000}:9000"]
    volumes: ["objects:/app/storage/objects"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:9000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      retries: 20
  app:
    build:
      context: .
      network: ${BUILD_NETWORK:-default}
    ports: ["127.0.0.1:${APP_PORT:-3000}:3000"]
    environment:
      DATABASE_URL: postgres://yolda:${POSTGRES_PASSWORD:-yolda_local}@db:5432/yolda
      APP_MODE: demo
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Yolda}
      STORAGE_DIR: /app/storage
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://storage:9000
      S3_BUCKET: yolda-private
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-S3RVER}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-S3RVER}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      retries: 40
      start_period: 15s
    volumes: ["photos:/app/storage"]
    depends_on:
      storage:
        condition: service_healthy
      db:
        condition: service_healthy
volumes:
  pgdata:
  photos:
  objects:
